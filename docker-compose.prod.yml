version: '3.9'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 512M
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile.prod
    container_name: alentapp-api-prod
    restart: unless-stopped
    image: alentapp-api:prod
    env_file: .env.prod
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M
        reservations:
          cpus: '0.50'
          memory: 512M
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http'); http.get('http://localhost:3000', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s      
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile.prod
    image: alentapp-web:prod
    container_name: alentapp-web-prod
    restart: unless-stopped
    env_file: .env.prod
    ports:
      - "8080:80"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    depends_on:
      api:
        condition: service_healthy
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - internal

volumes:
  pgdata:

networks:
  internal:
    name: alentapp-internal
    driver: bridge
